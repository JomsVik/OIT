name: Build Windows x64 archive
on:
  push:
    branches: [codex/rust-cartridge-inventory]
    paths-ignore:
      - 'releases/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          rustup update stable
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replace Windows bundle
        shell: pwsh
        run: |
          Expand-Archive releases/OIT-Windows-x64.zip -DestinationPath bundle
          Copy-Item target/release/oit-portal.exe bundle/OIT-local/oit-portal.exe -Force
          Copy-Item deploy/windows/* bundle/OIT-local/ -Force
          Compress-Archive -Path bundle/OIT-local -DestinationPath releases/OIT-Windows-x64.zip -Force
          $hash = (Get-FileHash releases/OIT-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content releases/OIT-Windows-x64.zip.sha256 "$hash  OIT-Windows-x64.zip" -Encoding ascii
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/OIT-Windows-x64.zip releases/OIT-Windows-x64.zip.sha256
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Rebuild Windows x64 archive"
            git push origin HEAD:codex/rust-cartridge-inventory
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
