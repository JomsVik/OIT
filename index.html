<!doctype html>
<html lang="ru" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ОИТ · Рабочий портал</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><script src="/cartridges.js" defer></script></head>
<body>
<div id="login-screen" class="login-layout">
  <section class="login-card">
    <h1 class="login-brand">IT<span>Портал</span></h1>
    <p class="login-subtitle">Отдел информационных технологий</p>
    <div class="login-tabs" role="group" aria-label="Тип учётной записи">
      <button type="button" class="login-tab active" data-account-type="users" aria-pressed="true">Пользователь</button>
      <button type="button" class="login-tab" data-account-type="admins" aria-pressed="false">Администратор</button>
    </div>
    <form id="login-form">
      <input name="type" type="hidden" value="users">
      <label>Логин<input name="login_id" autocomplete="username" placeholder="Введите логин" required autofocus></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" placeholder="Введите пароль" required></label>
      <button type="submit" class="btn-enter">Войти</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
    <p class="login-hint">Заявки · Оборудование · Картриджи</p>
  </section>
  <footer class="login-footer">Внутренний портал технической поддержки</footer>
</div>
<div id="workspace" hidden>
  <header class="admin-header">
    <div class="header-title"><a class="brand" href="/" aria-label="IT Портал">IT<span>Портал</span></a><span class="header-divider"></span><h1 id="workspace-title">Панель администратора</h1></div>
    <div class="header-actions"><button id="refresh-page" class="secondary" type="button">Обновить</button><div class="account-badge"><span id="account-role"></span><strong id="account-name"></strong></div></div>
  </header>
  <div class="navigation-bar"><nav id="navigation" class="admin-nav" aria-label="Основное меню"></nav><button id="logout" class="logout" type="button">Выход</button></div>
  <main id="screen-admin"><div class="page-context">Рабочее пространство <span>/</span> <strong id="page-name">Заявки</strong></div><div id="admin-content"></div></main>
  <footer class="workspace-footer">IT Портал <span>Отдел информационных технологий</span></footer>
</div>
<dialog id="editor"><form id="editor-form"><div class="dialog-heading"><h2 id="editor-title"></h2><button type="button" id="editor-close" class="secondary">Закрыть</button></div><div id="editor-fields"></div><p id="editor-error" class="error" role="alert"></p><button id="editor-save" type="submit">Сохранить</button></form></dialog><div id="toast" role="status" aria-live="polite" hidden></div>
</body></html>
