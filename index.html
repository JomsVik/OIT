<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Поддержка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================================
    СТРЕЛКИ НАВИГАЦИИ (ПО УГЛАМ)
    ============================================================ -->
    <!-- Стрелка вверх - правый верхний угол -->
    <button class="nav-arrow nav-arrow-up" onclick="app.scrollUp()" title="Вверх">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>
    
    <!-- Стрелка вниз - правый нижний угол -->
    <button class="nav-arrow nav-arrow-down" onclick="app.scrollDown()" title="Вниз">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
    </button>

    <!-- ============================================================
    ЭКРАН ВХОДА
    ============================================================ -->
    <div id="screen-login" class="screen active">
        <div class="login-container">
            <h1>IT<span>Портал</span></h1>
            
            <!-- Скрытое поле для входа (появляется по S+K) -->
            <div id="admin-login-section" style="display:none; margin-bottom:16px;">
                <div class="login-row">
                    <input type="text" id="admin-login-input" placeholder="Введите ID">
                    <button class="btn-enter" onclick="app.login()">→</button>
                </div>
            </div>
            
            <button class="btn-create-ticket" onclick="app.showScreen('screen-ticket')">📝 Оставить заявку</button>
            <button class="btn-track-tickets" onclick="app.showScreen('screen-track-tickets'); app.loadTrackedTickets()" style="margin-top:8px;width:100%;padding:12px;background:transparent;border:1px solid var(--border-color);border-radius:8px;color:var(--text-secondary);cursor:pointer;font-weight:600;">📋 Мои заявки</button>
            <button class="btn-find-ticket" onclick="app.showScreen('screen-find-ticket')" style="margin-top:8px;width:100%;padding:12px;background:var(--accent);border:1px solid var(--accent);border-radius:8px;color:#ffffff;cursor:pointer;font-weight:700;transition:0.2s;font-family:'Inter',sans-serif;">🔍 Найти заявку по номеру</button>
            
        </div>
    </div>

    <!-- ============================================================
    МОДАЛЬНОЕ ОКНО ДЛЯ КОММЕНТАРИЕВ
    ============================================================ -->
    <div id="comment-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="app.closeCommentModal()">&times;</span>
            <h2>Добавить комментарий</h2>
            <input type="hidden" id="comment-ticket-id">
            <div class="form-group">
                <label>Текст</label>
                <textarea id="comment-textarea" rows="4" placeholder="Введите комментарий..." required></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn-save" onclick="app.submitComment()">Отправить</button>
                <button class="btn-cancel" onclick="app.closeCommentModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    МОДАЛЬНОЕ ОКНО ДЛЯ ЗАДАЧ
    ============================================================ -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="app.closeTaskModal()">&times;</span>
            <h2 id="modal-title">Создать задачу</h2>
            <form id="task-form" onsubmit="event.preventDefault()">
                <!-- Поля заполняются динамически -->
            </form>
        </div>
    </div>

    <!-- ============================================================
    МОДАЛЬНОЕ ОКНО ДЛЯ ИНВЕНТАРЯ
    ============================================================ -->
    <div id="inventory-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="app.closeInventoryModal()">&times;</span>
            <h2 id="modal-title">Добавить запись</h2>
            <form id="inventory-form" onsubmit="app.saveInventoryItem(event)">
                <!-- Поля и кнопки добавляются динамически -->
            </form>
        </div>
    </div>

    <!-- ============================================================
    ЭКРАН ФОРМЫ ЗАЯВКИ (СВЕТЛАЯ ТЕМА)
    ============================================================ -->
    <div id="screen-ticket" class="screen">
        <form id="ticket-form" onsubmit="app.submitTicket(event)">
            <h2>Новая заявка</h2>
            <input type="text" name="employee" placeholder="ФИО сотрудника" required>
            <input type="text" name="location" placeholder="Кабинет" required>
            <textarea name="problem" rows="3" placeholder="Описание проблемы" required></textarea>
            <textarea name="comment" rows="2" placeholder="Комментарий (необязательно)"></textarea>
            <label>Срочность</label>
            <select name="urgency" required>
                <option value="Низкая">Низкая</option>
                <option value="Средняя" selected>Средняя</option>
                <option value="Высокая">Высокая</option>
            </select>
            <button type="submit" class="btn-round">Отправить</button>
            <div style="display:flex;gap:10px;justify-content:center;margin-top:10px;">
                <button type="button" class="back-link" onclick="app.showScreen('screen-login')">← Назад</button>
                <button type="button" class="back-link" onclick="app.showScreen('screen-track-tickets'); app.loadTrackedTickets()">📋 Мои заявки</button>
            </div>
        </form>
    </div>

    <!-- ============================================================
    ЭКРАН ОТСЛЕЖИВАНИЯ ЗАЯВОК (МОИ ЗАЯВКИ - СВЕТЛАЯ ТЕМА)
    ============================================================ -->
<div id="screen-track-tickets" class="screen" data-theme="light">
    <div class="track-container" style="background:#ffffff;padding:24px;border-radius:12px;border:1px solid #e2e8f0;max-width:900px;width:100%;margin:0 auto;">
        <!-- ЗАГОЛОВОК И КНОПКИ ТОЛЬКО ЗДЕСЬ (ОДИН РАЗ) -->
        <div class="track-header">
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <button class="btn-logout-track" onclick="app.logoutFromTracks()" style="padding:10px 24px;background:#fc8181;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:700;transition:0.2s;font-family:'Inter',sans-serif;">🚪 Выйти</button>
            </div>
        </div>
        <!-- КОНТЕЙНЕР ДЛЯ ЗАЯВОК (БЕЗ ЗАГОЛОВКА) -->
        <div id="screen-track-tickets-content">
            <p style="text-align:center;color:#718096;padding:40px;">Загрузка...</p>
        </div>
    </div>
</div>

    <!-- ============================================================
    ЭКРАН ПОИСКА ЗАЯВКИ ПО ТРЕК-НОМЕРУ (СВЕТЛАЯ ТЕМА)
    ============================================================ -->
    <div id="screen-find-ticket" class="screen" data-theme="light">
    <div class="find-container" style="background:#ffffff;padding:32px;border-radius:12px;border:1px solid #e2e8f0;max-width:700px;width:100%;margin:0 auto;">
        <div class="find-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
            <h2 style="color:#1a202c;font-size:24px;font-weight:700;">🔍 Найти заявку</h2>
            <button class="btn-back" onclick="app.showScreen('screen-login')" style="padding:8px 20px;background:transparent;border:1px solid #e2e8f0;border-radius:6px;color:#4a5568;cursor:pointer;font-weight:600;transition:0.2s;font-family:'Inter',sans-serif;">← Назад</button>
        </div>
        
        <div class="find-form" style="display:flex;gap:10px;margin-bottom:24px;">
            <input type="text" id="find-ticket-input" placeholder="Введите номер (2 буквы + 2 цифры, например: AB12)" 
                   onkeydown="if(event.key==='Enter') app.findTicketByToken()"
                   style="flex:1;padding:14px 18px;background:#f7fafc;border:2px solid #e2e8f0;border-radius:8px;font-size:16px;color:#1a202c;outline:none;transition:0.2s;font-family:'Inter',sans-serif;text-transform:uppercase;"
                   maxlength="4">
            <button class="btn-find" onclick="app.findTicketByToken()" style="padding:14px 32px;background:#4a9eff;color:#ffffff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;transition:0.2s;font-family:'Inter',sans-serif;white-space:nowrap;">🔍 Найти</button>
        </div>
            
            <div id="find-result">
                <!-- Сюда будет выводиться результат поиска -->
            </div>
        </div>
    </div>

   <!-- ============================================================
    ЭКРАН АДМИНКИ (ТЕМНАЯ ТЕМА)
    ============================================================ -->
    <div id="screen-admin" class="screen">
        <div class="admin-header">
            <h1>Панель администратора</h1>
            <div style="display:flex;gap:10px;align-items:center;">
                <button class="btn-create-ticket-admin" onclick="app.fromAdmin = true; app.showScreen('screen-ticket')">📝 Создать заявку</button>
                <div id="admin-role-indicator" class="admin-role">Администратор</div>
            </div>
        </div>

        <div class="admin-nav">
            <button class="nav-btn active" data-tab="active" onclick="app.switchTab('active')">Активные</button>
            <button class="nav-btn" data-tab="archived" onclick="app.switchTab('archived')">Архив</button>
            <button class="nav-btn" data-tab="tasks" onclick="app.switchTab('tasks')">Задачи</button>
            <button class="nav-btn" data-tab="tasks-archive" onclick="app.switchTab('tasks-archive')">Архив задач</button>
            <button class="nav-btn" data-tab="ip-stats" onclick="app.switchTab('ip-stats')">IP</button>
            <button class="nav-btn" data-tab="inventory" onclick="app.switchTab('inventory')">Инвентарь</button>
            <button class="nav-btn logout" onclick="app.logout()">Выход</button>
        </div>

        <div id="admin-content">
            <!-- Сюда грузятся заявки, задачи или инвентарь -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
