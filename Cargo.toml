[package]
name = "oit-portal"
version = "2.0.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde_json = "1"
serde_urlencoded = "0.7"
bcrypt = "0.19"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
dotenvy = "0.15"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
